name: Android APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check clap detection
        run: |
          mkdir -p build/test
          javac -d build/test src/tr/olgun/alkis/Claps.java test/DetectorTest.java
          java -cp build/test tr.olgun.alkis.DetectorTest
      - name: Check pickup detection
        run: |
          javac -d build/test src/tr/olgun/alkis/Pickup.java test/PickupTest.java
          java -cp build/test tr.olgun.alkis.PickupTest
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Signing-input
          path: build/aligned.apk
